  """One saved document; audited as `document.view`."""
  clinicalDocument(id: ID!): ClinicalDocument

  """Clinics the signed-in user can access."""
  clinics: [ClinicSummary!]!

  """The selected clinic (`x-loopwise-clinic-id`)."""
  currentClinic: ClinicSummary

  """The signed-in user's organization access level: admin, user or viewer."""
  currentOrgRole: String!

  """Synced warehouse tables of the selected clinic (`@` mentions)."""
  databaseObjects: [DatabaseObject!]!

  """Upstream `clinic.getDefaultChatModel`."""
  defaultChatModel: JSON

  """Upstream `clinic.getDefaultModels`."""
  defaultModels: JSON!

  """
  The tests the clinic's organization offers (its catalog), each with its analytes and ranges.
  """
  diagnosticTests(includeInactive: Boolean): [DiagnosticTest!]!

  """Upstream `clinic.getDisplaySettings`: the date format."""
  displaySettings: JSON!

  """A visit's invoices, price list and suggested lines."""
  encounterBilling(encounterId: ID!): EncounterBilling!

  """The visit's orders with their tests and results, oldest first."""
  encounterDiagnosticOrders(encounterId: ID!): [DiagnosticOrder!]!

  """Null when the encounter is not in your care."""
  encounterRecord(encounterId: ID!): EncounterRecord

  """The patient's encounters, newest first (empty if not in your care)."""
  encounters(patientId: ID!): [Encounter!]!

  """
  Whether any user exists yet (when none does, the app sends visitors to the /setup wizard).
  """
  hasUsers: Boolean!

  """Models known per provider (upstream `clinic.getKnownModels`)."""
  knownModels: JSON!

  """
  Transcription models per provider and whether a key is set (upstream `getKnownTranscribeModels`).
  """
  knownTranscribeModels: JSON!

  """
  The clinic's tests at these steps (default: every step before release), STAT first then oldest.
  """
  labWorklist(statuses: [DiagnosticOrderStatus!]): [LabWorklistItem!]!

  """How many tests each worklist tab holds."""
