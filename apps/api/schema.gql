  searchChats(limit: Int, query: String!): [ChatSearchResult!]!

  """Common ICD-10 codes by code prefix or title words."""
  searchIcd10(query: String!): [Icd10Code!]!

  """Patients you may see, by name words, patient no. / ID or birth date."""
  searchPatients(input: SearchPatientsInput!): [Patient!]!
  sharedChat(shareId: ID!): SharedChatView!
  sharedChatQuickQuestions(shareId: ID!): [QuickQuestionChat!]!

  """Chats shared in the clinics the user can access."""
  sharedChats: [SharedChat!]!

  """Every clinic skill, for the admin settings."""
  skillCatalog: [Skill!]!
  skillDetail(name: String!): SkillDetail!
  skillLoadErrors: [SkillLoadError!]!
  skillSaveStatus: SkillSaveStatus!

  """The clinic skills the signed-in user may use (the `/` picker)."""
  skills: [Skill!]!

  """Upstream `storage.getConfig`: the storage backend, secrets masked."""
