  mode: String!
  savedPeriodId: String
}

"""
The usage period the user picked in the clinic, and the periods they saved.
"""
type UsagePeriodSettings {
  savedPeriods: [SavedUsagePeriod!]!
  selection: UsagePeriodSelection
}

"""Messages, tokens and cost (USD) of one chart bucket."""
type UsageRecord {
  adminMessageCount: Int!
  contextRecommendationsMessageCount: Int!

  """The bucket: YYYY-MM-DD HH:00, YYYY-MM-DD or YYYY-MM (UTC)."""
  date: String!
  discordMessageCount: Int!
  inputCacheReadCost: Float!
  inputCacheReadTokens: Float!
  inputCacheWriteCost: Float!
  inputCacheWriteTokens: Float!
  inputNoCacheCost: Float!
  inputNoCacheTokens: Float!
  mattermostMessageCount: Int!
  mcpMessageCount: Int!
  messageCount: Int!
  outputCost: Float!
  outputTotalTokens: Float!
  slackMessageCount: Int!
  teamsMessageCount: Int!
  telegramMessageCount: Int!
  totalCost: Float!
  totalTokens: Float!
  webMessageCount: Int!
  whatsappMessageCount: Int!
}

"""A user with chats in the clinic, for the usage filters."""
type UsageUserFacet {
  chatCount: Int!
  userName: String!
}

type User {
  createdAt: DateTime!
  email: String!
  emailVerified: Boolean!
  id: ID!
  image: String

  """Whether the account is active (not deactivated by an admin)."""
  isActive: Boolean!
  name: String!

  """Set for invited users until they choose their own password."""
  requiresPasswordReset: Boolean!
}

type UserUsageBreakdown {
  messageCount: Int!
  totalCost: Float!
  totalTokens: Float!
  userName: String!
}

"""One set of vital signs. Units: mmHg, bpm, /min, °C, %, kg, cm, mg/dL."""
type VitalSigns {
  bloodGlucoseMgDl: Int

  """Computed from weight and height."""
  bmi: Float
  diastolicMmHg: Int
  heartRateBpm: Int
  heightCm: Float
  id: ID!
  painScore: Int
  recordedAt: DateTime!
  recordedById: ID!
  respiratoryRate: Int
  spo2Pct: Int
  systolicMmHg: Int
  temperatureC: Float
  voidReason: String
  voidedAt: DateTime
  weightKg: Float
}

"""
Voids an allergy recorded in error; it stays in the record, struck through.
"""
input VoidAllergyInput {
  id: ID!
  reason: String!

  """
  Set by a Wise card (`propose_void_*`, `propose_bill_step`): verified and settled with the void.
  """
  wiseOrigin: WiseOriginInput
}

"""
Voids a record entry entered in error; it stays in the record, struck through.
"""
input VoidEntryInput {
  id: ID!
  reason: String!

  """
  Set by a Wise card (`propose_void_*`, `propose_bill_step`): verified and settled with the void.
  """
  wiseOrigin: WiseOriginInput
}

input WiseOriginInput {
  chatId: ID!

  """Whether the clinician changed Wise's draft before confirming."""
  edited: Boolean!
  toolCallId: ID!

  """The proposal tool, e.g. `propose_encounter_note`."""
  toolName: String!
}

type WiseProposalOutcome {
  resourceId: String

  """`confirmed` or `cancelled`."""
  status: String!
  toolCallId: ID!
  toolName: String!
}

"""
A facility whose Wise tools the user sees, and whether they administer it.
"""
type WiseToolFacility {
  id: ID!
  isAdmin: Boolean!
  name: String!

  """The facility type (clinic, lab, …), which sets the defaults."""
  type: String!
}

type WiseToolSettings {
  facilities: [WiseToolFacility!]!

  """The facility the `facility*` fields are about."""
  facilityId: ID
  tools: [WiseToolView!]!
}

"""One Wise tool in Settings → Wise tools (DESIGN.md §9.4)."""
type WiseToolView {
  category: String!

  """Not a tool yet; no switch."""
  comingSoon: Boolean!

  """Whether Wise offers it to the user now."""
  enabled: Boolean!

  """The facility type's default at the selected facility."""
  facilityDefault: Boolean!

  """On at the selected facility (its override, else the default)."""
  facilityEnabled: Boolean!

  """read, navigate, display or propose."""
  kind: String!
  label: String!

  """Always on; no switch."""
  locked: Boolean!

  """False when the user turned it off for themselves."""
  myEnabled: Boolean!
  name: String!
  summary: String!
}

enum WorkFitness {
  fit_to_work
  fit_with_restrictions
  unfit
}