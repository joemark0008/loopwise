  """Upstream `chat.getForkMetadata`."""
  chatForkMetadata(chatId: ID!): JSON

  """Upstream `chat.listGrouped`."""
  chatList(input: ChatListInput): GroupedChatList!
  chatShareMembers(chatId: ID!): [ShareableMember!]!
  chatShareOptions(chatId: ID!): ChatShareOptions!

  """The organization's patients a registration would duplicate."""
  checkPatientDuplicates(input: PatientDraftInput!): [PatientDuplicate!]!
  checkUpdate: UpdateCheck!

  """SQL and column lineage behind a cited value (upstream `citation.get`)."""
