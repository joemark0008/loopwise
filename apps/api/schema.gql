  """Upstream `clinic.getLlmConfigs`: provider configs, keys previewed."""
  llmConfigs: JSON!

  """
  Every user of the organization, with their roles at the selected clinic (admins only).
  """
  managedUsers: [ManagedUser!]!

  """Upstream `clinic.getMapBoundaries`."""
  mapBoundaries: JSON!

  """The signed-in user."""
  me: User!

  """For printing (audited); null when not in your care."""
  medicalCertificate(id: ID!): MedicalCertificate

  """The signed-in user's active memories."""
  memories: [Memory!]!

  """Whether the signed-in user has memory turned on."""
  memorySettings: MemorySettings!

  """The clinics where you register patients and record visits."""
  myCareClinics: [ClinicRef!]!

  """
  Your practitioner profile (PRC license, PTR, S2 …); null until you add one.
  """
