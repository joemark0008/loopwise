  """Upstream `storage.getHealth`."""
  storageHealth: JSON!

  """Upstream `storage.getUploadLimits`."""
  storageUploadLimits: JSON!

  """Upstream `storage.getUsage`."""
  storageUsage: JSON!

  """Messages, tokens and cost per user and chart bucket."""
