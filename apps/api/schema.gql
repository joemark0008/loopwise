"""The waiting-room board of a clinic today."""
type QueueBoard {
  clinicName: String!

  """YYYY-MM-DD (Manila)."""
  date: String!

  """Called or being served, latest call first."""
  nowServing: [BoardTicket!]!

  """Waiting, in call order (priority lane first)."""
  waiting: [BoardTicket!]!
}

enum QueueStation {
  CASHIER
  DOCTOR
  TRIAGE
}

"""
WAITING → CALLED → SERVING → DONE; or SKIPPED (not there when called), CANCELLED.
"""
enum QueueStatus {
  CALLED
  CANCELLED
  DONE
  SERVING
  SKIPPED
  WAITING
}

"""
A patient's queue number for the day at a clinic; it follows them station to station.
"""
type QueueTicket {
  appointment: QueueTicketAppointment
  calledAt: DateTime
  clinicId: ID!

  """As called: "A-007", "P-002"."""
  code: String!
  doneAt: DateTime

  """Null when you may not see the visit."""
  encounter: QueueTicketEncounter
  id: ID!
  isPriority: Boolean!
  issuedAt: DateTime!
  number: Int!

  """Null when you may not see the patient."""
  patient: SchedulingPatient

  """The doctor whose line the patient joins."""
  practitioner: SchedulingPractitioner

  """"A" regular lane, "P" priority lane."""
  prefix: String!
  priorityReason: PriorityReason

  """YYYY-MM-DD."""
  queueDate: String!
  servedAt: DateTime
  station: QueueStation!

  """For the board: "Triage", "Dra. Reyes · Room 1", "Cashier"."""
  stationLabel: String!
  status: QueueStatus!
}

