  clinicName: String!
  roomName: String
}

enum PractitionerType {
  DENTIST
  MIDWIFE
  NURSE
  NUTRITIONIST_DIETITIAN
  OPTOMETRIST
  OTHER
  PHYSICAL_THERAPIST
  PHYSICIAN
  PSYCHOLOGIST
}

"""A prescription (℞) of an encounter (DESIGN.md §5)."""
type Prescription {
  createdAt: DateTime!
  documentStatus: DocumentStatus!
  encounterId: ID!
  id: ID!

  """A dangerous drug (S2 / yellow Rx, RA 9165)."""
  isDangerousDrug: Boolean!

  """Null while a draft."""
  issuedAt: DateTime
  items: [PrescriptionItem!]!
  notes: String
  patientId: ID!

  """The prescriber."""
  practitionerId: ID!

  """
  The clinic's Rx number, e.g. TAG-RX-2026-000123 (assigned with the draft).
  """
  rxNo: String!
  s2FormSerialNo: String
  signatory: DocumentSignatory

  """CANCELLED once voided."""
  status: PrescriptionStatus!

  """YYYY-MM-DD."""
  validUntil: String

  """Printed (and as a QR) so a pharmacy can check the Rx."""
  verificationCode: String!

  """Moves on every change; pass it back as `expectedVersion`."""
  version: Int!
  voidReason: String
  voidedAt: DateTime
}

"""One medicine of a prescription (generic name first, RA 6675)."""
type PrescriptionItem {
  brandName: String
  dispensedQty: Float!

  """e.g. "tablet", "suspension 250 mg/5 mL"."""
  dosageForm: String
  durationDays: Int
  frequency: String
  genericName: String!
  id: ID!

  """As needed."""
  isPrn: Boolean!
  quantity: Float!

  """Dangerous drugs (RA 9165): "twenty (20)"."""
  quantityInWords: String

  """PO, SL, TOP, IM …"""
  route: String

  """The directions as printed."""
  sig: String!
  sortOrder: Int!
  strength: String
  unit: String
}

input PrescriptionItemInput {
  brandName: String
  dosageForm: String

  """Per intake, e.g. "1 tablet"; writes the sig when none."""
  dose: String
  durationDays: Int
  frequency: String

  """Generic name (required, RA 6675)."""
  genericName: String!

  """As needed (PRN)."""
  isPrn: Boolean
  quantity: Float!

  """Required for dangerous drugs (RA 9165)."""
  quantityInWords: String

  """PO (default), SL, TOP, INH, NAS, OPH, OTIC, PR, PV, IM, IV, SC."""
  route: String

  """The directions as printed."""
  sig: String
  strength: String
  unit: String
}

"""
Dispensing state: ACTIVE → PARTIALLY_DISPENSED → DISPENSED; CANCELLED when voided; EXPIRED.
"""
enum PrescriptionStatus {
  ACTIVE
  CANCELLED
  DISPENSED
  EXPIRED
  PARTIALLY_DISPENSED
}

"""
The priority lane (RA 9994 seniors, RA 7277 / RA 10754 PWDs, pregnant, with an infant, emergency).
"""
enum PriorityReason {
  EMERGENCY
  PREGNANT
  PWD
  SENIOR_CITIZEN
  WITH_INFANT
}

type PublicConfig {
  authProviders: AuthProviders!
  betaAutomationsEnabled: Boolean!
  betaContextRecommendationsEnabled: Boolean!
  betaCustomStoriesEnabled: Boolean!
  betaStoryFiltersEnabled: Boolean!
  betaSubagentsEnabled: Boolean!
  emailVerificationEnabled: Boolean!
  enableUserLogin: Boolean!

  """Always "self-hosted": loopwise has no cloud mode."""
  loopwiseMode: String!
  version: String!
}

