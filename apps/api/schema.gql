  """Messages, tokens and cost per chart bucket."""
  usageMessages(filter: UsageFilterInput!): [UsageRecord!]!
  usagePeriodSettings(clinicId: ID!): UsagePeriodSettings!

  """Providers that appear in the usage."""
  usageProviders: [String!]!
  usageTotal(filter: UsageFilterInput!): TotalUsage!

  """Users with chats in the clinic and their chat count."""
  usageUserFacets: [UsageUserFacet!]!

  """The signed-in user's preferences (upstream `user.getPreferences`)."""
  userPreferences: JSON!
  version: AppVersion!

  """The settled Wise cards of one of your chats."""
