fragment PathwayFields on Pathway {
	key
	name
	version
	source
	resultReviewHours
	criticalAlertHours
	criticalFlagNextState
	closureEvidence
	closureDescription
	steps {
		state
		label
		slaHours
	}
	triggers {
		code
		codeSystem
		display
		type
		unit
		conversions {
			from
			factor
			offset
			note
		}
		bands {
			label
			classification
			urgency
			reason
			guideline
			nextState
			slaHours
		}
	}
}

query Pathways {
	pathways {
		...PathwayFields
	}
}

fragment ResultEvaluationFields on ResultEvaluation {
	id
	resultId
	pathwayKey
	pathwayName
	ruleVersion
	classification
	urgency
	reason
	guideline
	nextState
	slaHours
	basis
	evaluatedAt
	rule {
		code
		display
		band
		comparedValue
		comparedUnit
		received
	}
}

query ResultEvaluation($resultId: ID!) {
	resultEvaluation(resultId: $resultId) {
		...ResultEvaluationFields
	}
}
