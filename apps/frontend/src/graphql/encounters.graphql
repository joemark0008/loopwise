fragment EncounterFields on Encounter {
	id
	encounterNo
	patientId
	clinicId
	type
	status
	reason
	notes
	startedAt
	endedAt
	sourceChatId
	version
	clinic {
		id
		name
	}
	practitioner {
		id
		displayName
	}
}

query Encounters($patientId: ID!) {
	encounters(patientId: $patientId) {
		...EncounterFields
	}
}

mutation CreateEncounter($input: CreateEncounterInput!) {
	createEncounter(input: $input) {
		...EncounterFields
	}
}

query ClinicEncounters($input: ClinicEncountersInput!) {
	clinicEncounters(input: $input) {
		...EncounterFields
	}
}

mutation TransitionEncounter($input: TransitionEncounterInput!) {
	transitionEncounter(input: $input) {
		...EncounterFields
	}
}

query PatientChat($patientId: ID!) {
	patientChat(patientId: $patientId)
}
