fragment UsageRecordFields on UsageRecord {
	date
	messageCount
	webMessageCount
	slackMessageCount
	teamsMessageCount
	telegramMessageCount
	mattermostMessageCount
	discordMessageCount
	whatsappMessageCount
	adminMessageCount
	mcpMessageCount
	contextRecommendationsMessageCount
	inputNoCacheTokens
	inputCacheReadTokens
	inputCacheWriteTokens
	outputTotalTokens
	totalTokens
	inputNoCacheCost
	inputCacheReadCost
	inputCacheWriteCost
	outputCost
	totalCost
}

fragment UsagePeriodSelectionFields on UsagePeriodSelection {
	mode
	savedPeriodId
}

fragment SavedUsagePeriodFields on SavedUsagePeriod {
	id
	days
	granularity
}

query UsageMessages($filter: UsageFilterInput!) {
	usageMessages(filter: $filter) {
		...UsageRecordFields
	}
}

query UsageByUser($filter: UsageFilterInput!) {
	usageByUser(filter: $filter) {
		date
		users {
			userName
			messageCount
			totalTokens
			totalCost
		}
	}
}

query UsageTotal($filter: UsageFilterInput!) {
	usageTotal(filter: $filter) {
		totalMessages
		uniqueUsers
	}
}

query UsageProviders {
	usageProviders
}

query UsageUserFacets {
	usageUserFacets {
		userName
		chatCount
	}
}

query UsagePeriodSettings($clinicId: ID!) {
	usagePeriodSettings(clinicId: $clinicId) {
		selection {
			...UsagePeriodSelectionFields
		}
		savedPeriods {
			...SavedUsagePeriodFields
		}
	}
}

mutation UpdateUsagePeriodSelection($clinicId: ID!, $selection: UsagePeriodSelectionInput!) {
	updateUsagePeriodSelection(clinicId: $clinicId, selection: $selection) {
		...UsagePeriodSelectionFields
	}
}

mutation CreateSavedUsagePeriod($clinicId: ID!, $savedPeriod: SavedUsagePeriodInput!) {
	createSavedUsagePeriod(clinicId: $clinicId, savedPeriod: $savedPeriod) {
		...SavedUsagePeriodFields
	}
}

mutation UpdateSavedUsagePeriod($clinicId: ID!, $savedPeriod: UpdateSavedUsagePeriodInput!) {
	updateSavedUsagePeriod(clinicId: $clinicId, savedPeriod: $savedPeriod) {
		...SavedUsagePeriodFields
	}
}

mutation DeleteSavedUsagePeriod($clinicId: ID!, $id: ID!) {
	deleteSavedUsagePeriod(clinicId: $clinicId, id: $id) {
		id
		selection {
			...UsagePeriodSelectionFields
		}
	}
}
