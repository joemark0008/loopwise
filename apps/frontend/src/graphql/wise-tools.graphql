query WiseToolSettings($organizationId: ID) {
	wiseToolSettings(organizationId: $organizationId) {
		organizationId
		organizations {
			id
			name
			isAdmin
		}
		tools {
			name
			label
			summary
			kind
			category
			locked
			comingSoon
			organizationDefault
			organizationEnabled
			myEnabled
			enabled
		}
	}
}

mutation SetWiseToolEnabled($organizationId: ID!, $toolName: String!, $enabled: Boolean!) {
	setWiseToolEnabled(organizationId: $organizationId, toolName: $toolName, enabled: $enabled)
}

mutation SetMyWiseToolEnabled($toolName: String!, $enabled: Boolean!) {
	setMyWiseToolEnabled(toolName: $toolName, enabled: $enabled)
}
