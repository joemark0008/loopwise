fragment DiagnosticTestFields on DiagnosticTest {
	id
	code
	name
	category
	section
	specimenType
	requiresFasting
	loincCode
	parameters {
		id
		code
		name
		unit
		valueType
		options
		refLowMale
		refHighMale
		refLowFemale
		refHighFemale
		refRangeText
		sortOrder
	}
}

fragment DiagnosticResultFields on DiagnosticResult {
	id
	findings
	impression
	remarks
	flag
	urgency
	resultedAt
	releasedAt
	reviewedAt
	values {
		id
		parameterId
		name
		value
		unit
		referenceRange
		flag
	}
}

fragment DiagnosticOrderSummaryFields on DiagnosticOrderSummary {
	id
	orderNo
	encounterId
	priority
	status
	clinicalInfo
	isExternal
	externalPhysician
	requestedByName
	createdAt
}

fragment DiagnosticOrderFields on DiagnosticOrder {
	id
	orderNo
	encounterId
	priority
	status
	clinicalInfo
	isExternal
	externalPhysician
	requestedByName
	createdAt
	items {
		id
		status
		accessionNo
		specimenCollectedAt
		statusReason
		cancelledAt
		test {
			id
			code
			name
			category
			loincCode
		}
		result {
			...DiagnosticResultFields
		}
	}
}

fragment LabWorklistItemFields on LabWorklistItem {
	id
	status
	accessionNo
	specimenCollectedAt
	statusReason
	test {
		...DiagnosticTestFields
	}
	result {
		...DiagnosticResultFields
	}
	order {
		...DiagnosticOrderSummaryFields
	}
	patient {
		id
		patientNo
		firstName
		lastName
		middleName
		birthDate
		sex
	}
}

query DiagnosticTests {
	diagnosticTests {
		...DiagnosticTestFields
	}
}

query EncounterDiagnosticOrders($encounterId: ID!) {
	encounterDiagnosticOrders(encounterId: $encounterId) {
		...DiagnosticOrderFields
	}
}

query LabWorklist($statuses: [DiagnosticOrderStatus!]) {
	labWorklist(statuses: $statuses) {
		...LabWorklistItemFields
	}
}

query LabWorklistCounts {
	labWorklistCounts {
		status
		count
	}
}

mutation CreateDiagnosticOrder($input: CreateDiagnosticOrderInput!) {
	createDiagnosticOrder(input: $input) {
		...DiagnosticOrderFields
	}
}

mutation CancelDiagnosticOrder($input: CancelDiagnosticOrderInput!) {
	cancelDiagnosticOrder(input: $input) {
		id
		status
	}
}

mutation MarkSpecimenCollected($input: MarkSpecimenCollectedInput!) {
	markSpecimenCollected(input: $input) {
		id
		status
		accessionNo
	}
}

mutation StartDiagnosticOrderItem($input: DiagnosticItemStepInput!) {
	startDiagnosticOrderItem(input: $input) {
		id
		status
	}
}

mutation EnterDiagnosticResult($input: EnterDiagnosticResultInput!) {
	enterDiagnosticResult(input: $input) {
		...LabWorklistItemFields
	}
}

mutation ReleaseDiagnosticResult($input: DiagnosticItemStepInput!) {
	releaseDiagnosticResult(input: $input) {
		id
		status
	}
}
