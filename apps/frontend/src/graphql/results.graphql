fragment DiagnosticReportFields on DiagnosticReport {
	id
	orderItemId
	status
	findings
	impression
	remarks
	flag
	urgency
	resultedAt
	releasedAt
	reviewedAt
	clinicName
	values {
		id
		name
		value
		unit
		referenceRange
		flag
	}
	test {
		id
		code
		name
		category
		loincCode
	}
	order {
		id
		orderNo
		encounterId
		priority
		requestedByName
	}
	patient {
		id
		patientNo
		firstName
		lastName
		birthDate
		sex
	}
}

query ResultsToReview {
	resultsToReview {
		...DiagnosticReportFields
	}
}

query PatientResults($patientId: ID!) {
	patientResults(patientId: $patientId) {
		...DiagnosticReportFields
	}
}

mutation ReviewResult($input: ReviewResultInput!) {
	reviewResult(input: $input) {
		...DiagnosticReportFields
	}
}
