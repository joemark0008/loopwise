fragment PatientFields on Patient {
	id
	organizationId
	patientNo
	givenName
	middleName
	familyName
	suffix
	birthDate
	sex
	phone
	email
	preferredLanguage
	barangay
	address {
		addressLine
		barangayCode
		barangayName
		cityMunicipalityName
	}
	consentAt
	createdAt
	identifications {
		id
		type
		idNumber
		label
	}
}

fragment PatientDuplicateFields on PatientDuplicate {
	patientId
	match
	visible
	matchedOn
	displayName
	birthYear
}

query MyCareClinics {
	myCareClinics {
		id
		name
		code
		organizationId
		cityMunicipalityCode
	}
}

query Barangays($cityMunicipalityCode: String!) {
	barangays(cityMunicipalityCode: $cityMunicipalityCode) {
		code
		name
	}
}

query SearchPatients($input: SearchPatientsInput!) {
	searchPatients(input: $input) {
		...PatientFields
	}
}

query Patient($id: ID!) {
	patient(id: $id) {
		...PatientFields
	}
}

query CheckPatientDuplicates($input: PatientDraftInput!) {
	checkPatientDuplicates(input: $input) {
		...PatientDuplicateFields
	}
}

mutation RegisterPatient($input: RegisterPatientInput!) {
	registerPatient(input: $input) {
		patient {
			...PatientFields
		}
		duplicates {
			...PatientDuplicateFields
		}
	}
}

mutation LinkExistingPatient($input: LinkExistingPatientInput!) {
	linkExistingPatient(input: $input) {
		...PatientFields
	}
}
