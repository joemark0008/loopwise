fragment WiseProposalOutcomeFields on WiseProposalOutcome {
	toolCallId
	toolName
	status
	resourceId
	edited
}

query WiseProposalOutcomes($chatId: ID!) {
	wiseProposalOutcomes(chatId: $chatId) {
		...WiseProposalOutcomeFields
	}
}

mutation CancelWiseProposal($input: WiseOriginInput!) {
	cancelWiseProposal(input: $input) {
		...WiseProposalOutcomeFields
	}
}
