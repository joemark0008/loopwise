fragment VitalSignsFields on VitalSigns {
	id
	systolicMmHg
	diastolicMmHg
	heartRateBpm
	respiratoryRate
	temperatureC
	spo2Pct
	weightKg
	heightCm
	bmi
	bloodGlucoseMgDl
	painScore
	recordedAt
	voidedAt
	voidReason
}

fragment DiagnosisFields on EncounterDiagnosis {
	id
	icd10Code
	description
	type
	isFinal
	sortOrder
	notes
	voidedAt
	voidReason
}

fragment AllergyFields on PatientAllergy {
	id
	allergen
	type
	reaction
	severity
	notedAt
}

fragment PrescriptionItemFields on PrescriptionItem {
	id
	sortOrder
	genericName
	brandName
	strength
	dosageForm
	sig
	route
	frequency
	durationDays
	isPrn
	quantity
	unit
	quantityInWords
	dispensedQty
}

fragment PrescriptionFields on Prescription {
	id
	version
	encounterId
	patientId
	practitionerId
	rxNo
	documentStatus
	status
	isDangerousDrug
	s2FormSerialNo
	verificationCode
	notes
	issuedAt
	voidedAt
	voidReason
	createdAt
	items {
		...PrescriptionItemFields
	}
}

fragment MedicalCertificateFields on MedicalCertificate {
	id
	version
	encounterId
	patientId
	practitionerId
	certNo
	type
	documentStatus
	examinedOn
	diagnosisText
	findings
	recommendation
	isFitToWork
	restFrom
	restTo
	restDays
	purpose
	peClassification
	verificationCode
	issuedAt
	isVoid
	voidedAt
	voidReason
	createdAt
}

fragment ReferralFields on Referral {
	id
	encounterId
	status
	urgency
	reason
	specialty
	toExternalDoctor
	toFacility
	referredAt
	toPractitioner {
		id
		displayName
	}
}

fragment SignatoryFields on DocumentSignatory {
	name
	credentials
	specialty
	licenseNumber
	ptrNumber
	s2LicenseNo
	facilityName
	facilityAddress
	facilityPhone
}

fragment EncounterDocumentsFields on EncounterRecord {
	prescriptions {
		...PrescriptionFields
	}
	medicalCertificates {
		...MedicalCertificateFields
	}
	referrals {
		...ReferralFields
	}
}

fragment EncounterRecordFields on EncounterRecord {
	canEdit
	encounter {
		...EncounterFields
		history
		physicalExam
		assessment
		plan
		patientInstructions
		followUpOn
		disposition
	}
	vitals {
		...VitalSignsFields
	}
	diagnoses {
		...DiagnosisFields
	}
	allergies {
		...AllergyFields
	}
	...EncounterDocumentsFields
}

query EncounterRecord($encounterId: ID!) {
	encounterRecord(encounterId: $encounterId) {
		...EncounterRecordFields
	}
}

fragment PatientOverviewFields on PatientOverview {
	patientId
	visits {
		encounter {
			...EncounterFields
		}
		diagnoses {
			...DiagnosisFields
		}
		prescriptions {
			...PrescriptionFields
		}
	}
}

query PatientOverview($patientId: ID!) {
	patientOverview(patientId: $patientId) {
		...PatientOverviewFields
	}
}

query PatientAllergies($patientId: ID!) {
	patientAllergies(patientId: $patientId) {
		...AllergyFields
	}
}

query SearchIcd10($query: String!) {
	searchIcd10(query: $query) {
		code
		title
	}
}

query PrescriptionPrint($id: ID!) {
	prescription(id: $id) {
		...PrescriptionFields
		signatory {
			...SignatoryFields
		}
	}
}

query MedicalCertificatePrint($id: ID!) {
	medicalCertificate(id: $id) {
		...MedicalCertificateFields
		signatory {
			...SignatoryFields
		}
	}
}

fragment PractitionerFields on Practitioner {
	id
	type
	title
	firstName
	middleName
	lastName
	suffix
	postNominals
	displayName
	specialty
	subspecialty
	prcLicenseNo
	prcLicenseExpiry
	ptrNo
	ptrIssuedDate
	ptrIssuedAt
	s2LicenseNo
	s2LicenseExpiry
	philhealthPan
	philhealthPanExpiry
}

query MyPractitioner {
	myPractitioner {
		...PractitionerFields
	}
}

mutation SaveMyPractitioner($input: SaveMyPractitionerInput!) {
	saveMyPractitioner(input: $input) {
		...PractitionerFields
	}
}

mutation UpdateEncounterNote($input: UpdateEncounterNoteInput!) {
	updateEncounterNote(input: $input) {
		id
		version
	}
}

mutation RecordVitals($input: RecordVitalsInput!) {
	recordVitals(input: $input) {
		id
	}
}

mutation VoidVitals($input: VoidEntryInput!) {
	voidVitals(input: $input) {
		id
	}
}

mutation AddDiagnosis($input: AddDiagnosisInput!) {
	addDiagnosis(input: $input) {
		id
	}
}

mutation UpdateDiagnosis($input: UpdateDiagnosisInput!) {
	updateDiagnosis(input: $input) {
		id
	}
}

mutation VoidDiagnosis($input: VoidEntryInput!) {
	voidDiagnosis(input: $input) {
		id
	}
}

mutation AddAllergy($input: AddAllergyInput!) {
	addAllergy(input: $input) {
		id
	}
}

mutation VoidAllergy($input: VoidAllergyInput!) {
	voidAllergy(input: $input) {
		id
	}
}

mutation SavePrescription($input: SavePrescriptionInput!) {
	savePrescription(input: $input) {
		id
	}
}

mutation IssuePrescription($id: ID!, $overrideAllergyWarning: Boolean, $wiseOrigin: WiseOriginInput) {
	issuePrescription(id: $id, overrideAllergyWarning: $overrideAllergyWarning, wiseOrigin: $wiseOrigin) {
		id
	}
}

mutation VoidPrescription($input: VoidEntryInput!) {
	voidPrescription(input: $input) {
		id
	}
}

mutation SaveMedicalCertificate($input: SaveMedicalCertificateInput!) {
	saveMedicalCertificate(input: $input) {
		id
	}
}

mutation IssueMedicalCertificate($id: ID!, $wiseOrigin: WiseOriginInput) {
	issueMedicalCertificate(id: $id, wiseOrigin: $wiseOrigin) {
		id
	}
}

mutation VoidMedicalCertificate($input: VoidEntryInput!) {
	voidMedicalCertificate(input: $input) {
		id
	}
}
