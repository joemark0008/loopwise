name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: loopwise
                    POSTGRES_PASSWORD: loopwise
                    POSTGRES_DB: loopwise
                ports:
                    - 5435:5432
                options: >-
                    --health-cmd "pg_isready -U loopwise -d loopwise"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql://loopwise:loopwise@localhost:5435/loopwise
            BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
            BETTER_AUTH_URL: http://localhost:3000
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - run: npm install -g npm@11.10.1
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint
            - run: npm test
